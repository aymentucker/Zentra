name: Zentra
options:
  bundleIdPrefix: com.zentra
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    PRODUCT_BUNDLE_IDENTIFIER: com.zentra.app

targets:
  ZentraRemovalService:
    type: tool
    platform: macOS
    sources:
      - path: ZentraRemovalService
        excludes:
          - com.zentra.app.removal-service.plist
    settings:
      base:
        PRODUCT_NAME: ZentraRemovalService
        PRODUCT_BUNDLE_IDENTIFIER: com.zentra.app.removal-service
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES

  Zentra:
    type: application
    platform: macOS
    sources:
      - path: Zentra
        excludes:
          - Resources
          - Assets.xcassets
      - path: Zentra/Resources
        buildPhase: resources
      - path: Zentra/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: ZentraRemovalService
        embed: false
    preBuildScripts:
      - name: Embed Removal Service
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP_CONTENTS="$BUILT_PRODUCTS_DIR/$WRAPPER_NAME/Contents"
          mkdir -p "$APP_CONTENTS/MacOS" "$APP_CONTENTS/Library/LaunchDaemons"
          cp "$BUILT_PRODUCTS_DIR/ZentraRemovalService" "$APP_CONTENTS/MacOS/ZentraRemovalService"
          cp "$SRCROOT/ZentraRemovalService/com.zentra.app.removal-service.plist" "$APP_CONTENTS/Library/LaunchDaemons/com.zentra.app.removal-service.plist"
    settings:
      base:
        PRODUCT_NAME: Zentra
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zentra
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ZentraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ZentraTests
    dependencies:
      - target: Zentra
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zentra.tests
    scheme: {}

schemes:
  Zentra:
    build:
      targets:
        Zentra: all
        ZentraRemovalService: all
        ZentraTests: [test]
    test:
      targets:
        - ZentraTests
