name: Zentra
options:
  bundleIdPrefix: com.zentra
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    PRODUCT_BUNDLE_IDENTIFIER: com.zentra.app

targets:
  Zentra:
    type: application
    platform: macOS
    sources:
      - path: Zentra
        excludes:
          - Resources
          - Assets.xcassets
      - path: Zentra/Resources
        buildPhase: resources
      - path: Zentra/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Zentra
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zentra
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ZentraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ZentraTests
    dependencies:
      - target: Zentra
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zentra.tests
    scheme: {}

schemes:
  Zentra:
    build:
      targets:
        Zentra: all
        ZentraTests: [test]
    test:
      targets:
        - ZentraTests
